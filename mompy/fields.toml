# Every field of a game record that mompy knows. Offsets are from the start of the record.
# Where each was checked: docs/reference/ram-layout.md. "confidence" is "checked" (seen to drive the real game) or "guess".

[blocks.wizard]
stride = 1224   # 0x4C8
count = 5
first_number = 1
describe = "wizard"
table = "wizards"

[blocks.fortress]
stride = 4
count = 6          # the five wizards, then the neutral player
first_number = 1
describe = "fortress"
table = "fortresses"

[blocks.city]
stride = 114
count = 100
first_number = 1
describe = "city"
table = "cities"

[blocks.unit]
stride = 32
count = 1009
first_number = 0     # the game's own index; `pew` and `where` print these
describe = "unit"
table = "units"

[[field]]
block = "wizard"
name = "name"
offset = 0x1
type = "text"
length = 20
writable = true
confidence = "checked"
note = "Printable ASCII, 1 to 19 characters, NUL-padded to 20 bytes."

[[field]]
block = "wizard"
name = "banner"
offset = 0x16
type = "u8"
enum = { "0" = "blue", "1" = "green", "2" = "purple", "3" = "red", "4" = "yellow" }
writable = false
confidence = "checked"
note = "The wizard's flag colour."

[[field]]
block = "wizard"
name = "fame"
offset = 0x24
type = "u16"
min = 0
max = 30000
writable = true
confidence = "checked"
note = "The base value. The Info screen shows it plus a bonus (77 shown as 90, 30000 as 30013)."

[[field]]
block = "wizard"
name = "power_base"
offset = 0x26
type = "u16"
writable = false
derived = true
confidence = "checked"
note = "Worked out again by the game; a write would be overwritten."

[[field]]
block = "wizard"
name = "ratios"
offset = 0x2A
type = "u8"
count = 3
labels = ["research", "mana", "skill"]
writable = false
confidence = "guess"
note = "Percent split of the power base; they sum to 100. Only the skill slot's position was checked."

[[field]]
block = "wizard"
name = "summoning_circle"
offset = 0x2E
type = "i16"
count = 3
labels = ["x", "y", "plane"]
writable = false
format = "map_position"
confidence = "checked"
note = "Map position of the wizard's summoning circle; plane 0 Arcanus, 1 Myrror."

[[field]]
block = "wizard"
name = "research_candidates"
offset = 0x34
type = "u16"
count = 8
format = "spell"
writable = false
confidence = "checked"
note = "Spell numbers the game offers to research next (0 = empty slot)."

[[field]]
block = "wizard"
name = "skill_left"
offset = 0x54
type = "u16"
writable = false
derived = true
confidence = "checked"
note = "Casting skill left this turn."

[[field]]
block = "wizard"
name = "casting_skill"
offset = 0x56
type = "u16"
writable = false
derived = true
confidence = "checked"
note = "The nominal casting skill, 'Casting Skill: N(N)' on the Magic screen."

[[field]]
block = "wizard"
name = "tax_rate"
offset = 0x58
type = "u16"
min = 0
max = 6
writable = false
confidence = "checked"
note = "Index into the tax list: 0 is no tax, 6 is 3 gold per citizen."

[[field]]
block = "wizard"
name = "books"
offset = 0x5A
type = "i16"
count = 5
labels = ["nature", "sorcery", "chaos", "life", "death"]
min = 0
max = 13
writable = true
confidence = "checked"
note = "Spellbooks per realm. 13 in every realm was loaded and survived a turn."

[[field]]
block = "wizard"
name = "retorts"
offset = 0x64
type = "u8"
count = 18
labels = ["Alchemy", "Warlord", "Chaos Mastery", "Nature Mastery", "Sorcery Mastery", "Infernal Power", "Divine Power", "Sage Master", "Channeler", "Myrran", "Archmage", "Mana Focusing", "Node Mastery", "Famous", "Runemaster", "Conjurer", "Charismatic", "Artificer"]
min = 0
max = 1
writable = true
confidence = "checked"
note = "1 if the wizard has the retort. The save does not enforce the new-game rules."

[[field]]
block = "wizard"
name = "relations"
offset = 0x152
type = "i8"
count = 6
labels = "wizards"
min = -100
max = 100
writable = true
mirrored = true
confidence = "checked"
note = "How this wizard sees each other wizard (the Diplomacy screen's figure); the neutral player is last. The game keeps each pair on both wizards, so a write must change both."

[[field]]
block = "wizard"
name = "treaty_status"
offset = 0x158
type = "u8"
count = 6
labels = "wizards"
enum = { "0" = "none (peace)", "1" = "wizard pact", "2" = "alliance", "3" = "war" }
min = 0
max = 3
writable = true
mirrored = true
confidence = "checked"
note = "Toward each other wizard; kept on both. Peace is just 0."

[[field]]
block = "wizard"
name = "research_left"
offset = 0x25A
type = "u16"
min = 0
max = 65535
writable = true
confidence = "checked"
note = "Research points left on the spell being researched."

[[field]]
block = "wizard"
name = "mana"
offset = 0x25C
type = "u16"
min = 0
max = 30000
writable = true
confidence = "checked"
note = "Magic reserve. 30000 is the game's own cap."

[[field]]
block = "wizard"
name = "researching"
offset = 0x262
type = "u16"
format = "spell"
min = 0
max = 214
writable = true
confidence = "checked"
note = "Spell number being researched, 0 for none. Set it only to one of research_candidates, or the Research page shows nothing."

[[field]]
block = "wizard"
name = "spells"
offset = 0x264
type = "u8"
count = 214
labels = "spells"
enum = { "0" = "unknown", "1" = "knowable", "2" = "known", "3" = "on the research list" }
min = 0
max = 3
writable = true
confidence = "checked"
note = "Spell n is byte n-1. Spells are learned without the matching books."

[[field]]
block = "wizard"
name = "gold"
offset = 0x356
type = "u16"
min = 0
max = 30000
writable = true
confidence = "checked"
note = "Treasury. 30000 is the game's own cap."

[[field]]
block = "wizard"
name = "globals"
offset = 0x482
type = "u8"
count = 24
labels = ["Eternal Night", "Evil Omens", "Zombie Mastery", "Aura of Majesty", "Wind Mastery", "Suppress Magic", "Time Stop", "Nature Awareness", "Nature's Wrath", "Herb Mastery", "Chaos Surge", "Doom Mastery", "Great Wasting", "Meteor Storm", "Armageddon", "Tranquility", "Life Force", "Crusade", "Just Cause", "Holy Arms", "Planar Seal", "Charm of Life", "Detect Magic", "Awareness"]
min = 0
max = 1
writable = true
confidence = "checked"
note = "1 when this wizard has that global enchantment active. Real casts seen: bytes 3 (Aura of Majesty) and 18 (Just Cause). Set by hand and watched through an End Turn: Aura of Majesty, Wind Mastery, Nature's Wrath, Herb Mastery, Tranquility, Planar Seal, Meteor Storm, Great Wasting, Armageddon, Time Stop (docs/reference/globals.md)."

[[field]]
block = "fortress"
name = "x"
offset = 0x0
type = "u8"
min = 0
max = 59
writable = false
confidence = "checked"
note = "Map column of the wizard's fortress (the tower, his capital). Same as the summoning circle's until that is moved."

[[field]]
block = "fortress"
name = "y"
offset = 0x1
type = "u8"
min = 0
max = 39
writable = false
confidence = "checked"
note = "Map row of the fortress."

[[field]]
block = "fortress"
name = "plane"
offset = 0x2
type = "u8"
min = 0
max = 1
enum = { "0" = "Arcanus", "1" = "Myrror" }
writable = false
confidence = "checked"
note = "0 Arcanus, 1 Myrror."

[[field]]
block = "fortress"
name = "active"
offset = 0x3
type = "u8"
min = 0
max = 1
enum = { "0" = "banished", "1" = "in place" }
writable = true
confidence = "checked"
note = "0 means the wizard has lost his fortress: banished (he casts Spell of Return). The Magic screen draws him as a cracked stone frame: seen by changing this byte in a save and, live, in memory (2026-10-13; the first of the two copies is the one the game reads)."

[[field]]
block = "city"
name = "name"
offset = 0x0
type = "text"
length = 14
writable = false
confidence = "checked"
note = "The city's name, NUL-padded; the game's own city list shows it."

[[field]]
block = "city"
name = "x"
offset = 0xF
type = "u8"
min = 0
max = 59
writable = false
confidence = "checked"
note = "Map column."

[[field]]
block = "city"
name = "y"
offset = 0x10
type = "u8"
min = 0
max = 39
writable = false
confidence = "checked"
note = "Map row."

[[field]]
block = "city"
name = "plane"
offset = 0x11
type = "u8"
min = 0
max = 1
enum = { "0" = "Arcanus", "1" = "Myrror" }
writable = false
confidence = "checked"
note = "0 Arcanus, 1 Myrror."

[[field]]
block = "city"
name = "owner"
offset = 0x12
type = "u8"
min = 0
max = 5
writable = false
confidence = "checked"
note = "Wizard record 0 to 4 (wizard 1 is 0), or 5 for neutral. Not editable: handing a city over also clears its enchantments and moves its units (Mirror's edit_city does all three)."

[[field]]
block = "city"
name = "population"
offset = 0x14
type = "u8"
min = 1
max = 25
writable = true
confidence = "checked"
note = "Population in thousands: the city screen shows this times 1000 plus the tens at +24 (a live RAM write showed it). Only the thousands are written; the tens stay. 25 as the top is Mirror's guess at the game's cap."

[[field]]
block = "city"
name = "production"
offset = 0x1C
type = "u16"
writable = false
confidence = "checked"
note = "The item in production, by the same ids as the buildings: 1 Trade Goods, 2 Housing, 3 to 35 buildings (29 Granary, 35 City Walls); larger numbers are units; 0xFFFC on cities that build nothing. Seen while the city screen said Producing Housing, Granary, then back (Mirror's live-ram-map.md)."

[[field]]
block = "city"
name = "production_per_turn"
offset = 0x5D
type = "u8"
writable = false
confidence = "checked"
note = "Hammers per turn; the city screen showed the same number."

[[field]]
block = "city"
name = "production_stored"
offset = 0x5E
type = "u16"
min = 0
max = 30000
writable = true
confidence = "guess"
note = "Production stored toward the item. The game itself set it to the full cost when a building was bought (0 -> 40, Granary) and to 0 when built; a hand-written value is not yet seen to complete the building. 30000 as the top is mompy's own safe limit (the field is a u16)."

# --- a unit record (32 bytes). Layout: ReMoM's s_UNIT and the 2001 save-game page (both in the Evi vault), and the real game (2026-10-13/14).
[[field]]
block = "unit"
name = "x"
offset = 0x0
type = "u8"
min = 0
max = 59
writable = true
confidence = "guess"
note = "Map column. Writing it moves the unit, but the map draws from a picture built earlier: nudge the map view (or end the turn) to see it, and until then the unit may seem to vanish."

[[field]]
block = "unit"
name = "y"
offset = 0x1
type = "u8"
min = 0
max = 39
writable = true
confidence = "guess"
note = "Map row. See x."

[[field]]
block = "unit"
name = "plane"
offset = 0x2
type = "u8"
min = 0
max = 1
enum = { "0" = "Arcanus", "1" = "Myrror" }
writable = true
confidence = "guess"
note = "0 Arcanus, 1 Myrror. 255 marks a dead unit (with owner 255); `pew` writes that. See x."

[[field]]
block = "unit"
name = "owner"
offset = 0x3
type = "u8"
min = 0
max = 5
format = "owner"
writable = false
confidence = "checked"
note = "Wizard record 0 to 4 (wizard 1 is 0), 5 neutral, 255 dead. Not editable: a unit also belongs to a stack and a banner."

[[field]]
block = "unit"
name = "max_moves"
offset = 0x4
type = "i8"
min = 0
max = 127
writable = true
confidence = "guess"
note = "Moves per turn, in half-moves; from the unit type's record (type byte +9) when the unit is made. The game fills moves_left from it each turn."

[[field]]
block = "unit"
name = "type"
offset = 0x5
type = "u8"
min = 0
max = 197
format = "unit_type"
writable = false
confidence = "checked"
note = "Index into the game's unit type table (names come from the game's memory). 0 to 34 heroes, 35 to 153 ordinary units and boats, 154 to 197 summoned creatures."

[[field]]
block = "unit"
name = "hero_slot"
offset = 0x6
type = "i8"
min = -1
max = 5
writable = false
confidence = "checked"
note = "Index into the wizard's hero list for a hero, -1 for any other unit."

[[field]]
block = "unit"
name = "moves_left"
offset = 0x8
type = "i8"
min = 0
max = 127
writable = true
confidence = "checked"
note = "Half-moves left this turn: a signed byte, 127 is the top (63.5 moves; `mompy unit mercury`). Checked live: 20 showed 10 moves, 127 showed 63.5."

[[field]]
block = "unit"
name = "status"
offset = 0xB
type = "u8"
writable = false
confidence = "guess"
note = "What the unit is doing. Seen: 1 and 3 (on its way somewhere); the rest is not decoded."

[[field]]
block = "unit"
name = "level"
offset = 0xC
type = "u8"
min = 0
max = 8
writable = true
confidence = "checked"
note = "Experience level: 0 Recruit, 1 Regular, 2 Veteran, 3 Elite (units 0 to 5, heroes 0 to 8). The game shows it as written, then works it out again from experience at End Turn: set experience too if it must stay."

[[field]]
block = "unit"
name = "experience"
offset = 0xE
type = "i16"
min = 0
max = 30000
writable = true
confidence = "checked"
note = "Experience points. A normal unit is capped at 120 (Elite) at End Turn; `create` writes 120 and the unit screen showed Elite 120ep."

[[field]]
block = "unit"
name = "damage"
offset = 0x11
type = "u8"
min = 0
max = 255
writable = true
confidence = "guess"
note = "Damage taken (hits); 0 is unhurt. Nature's Cures sets this and only this to 0 (ReMoM)."

[[field]]
block = "unit"
name = "sight"
offset = 0x16
type = "u8"
writable = false
confidence = "checked"
note = "Sight range, from the unit type's record (type byte +19); 160 of 160 units agreed."

[[field]]
block = "unit"
name = "mutations"
offset = 0x17
type = "u8"
min = 0
max = 255
format = "mutations"
writable = true
confidence = "guess"
note = "The low two bits are the weapon grade (0 normal, 1 magic, 2 mithril, 3 adamantium: seen on a unit screen, 2026-10-13); the high bits are mutation flags (undead 0x20, demon wings, ...). `create` writes 3."

[[field]]
block = "unit"
name = "enchantments"
offset = 0x18
type = "u32"
format = "enchantments"
writable = false
confidence = "checked"
note = "The unit's enchantments as bits (Flight 0x20000...). Not editable here: `mompy unit cast mass.NAME` does it for a stack."
