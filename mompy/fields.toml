[[field]]
block = "fortress"
name = "plane"
offset = 0x2
type = "u8"
min = 0
max = 1
enum = { "0" = "Arcanus", "1" = "Myrror" }
writable = false
confidence = "checked"
note = "0 Arcanus, 1 Myrror."

[[field]]
block = "fortress"
name = "active"
offset = 0x3
type = "u8"
min = 0
max = 1
enum = { "0" = "banished", "1" = "in place" }
writable = true
confidence = "checked"
note = "0 means the wizard has lost his fortress: banished (he casts Spell of Return). The Magic screen draws him as a cracked stone frame: seen by changing this byte in a save and, live, in memory (2026-10-13; the first of the two copies is the one the game reads)."

[[field]]
block = "city"
name = "name"
offset = 0x0
type = "text"
length = 14
writable = false
confidence = "checked"
note = "The city's name, NUL-padded; the game's own city list shows it."

[[field]]
block = "city"
name = "x"
offset = 0xF
type = "u8"
min = 0
max = 59
writable = false
confidence = "checked"
note = "Map column."

[[field]]
block = "city"
name = "y"
offset = 0x10
type = "u8"
min = 0
max = 39
writable = false
confidence = "checked"
note = "Map row."

[[field]]
block = "city"
