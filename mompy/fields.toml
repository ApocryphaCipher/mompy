type = "u16"
writable = false
derived = true
confidence = "checked"
note = "Casting skill left this turn."

[[field]]
block = "wizard"
name = "casting_skill"
offset = 0x56
type = "u16"
writable = false
derived = true
confidence = "checked"
note = "The nominal casting skill, 'Casting Skill: N(N)' on the Magic screen."

[[field]]
