[project]
name = "mompy"
version = "0.0.1"
description = "Read and change a running Master of Magic through DOSBox Staging's memory API"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []          # standard library only, on purpose: easy to install and to share

[project.scripts]
mompy = "mompy.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mompy"]
